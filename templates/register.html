<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create account · CloudVault</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="brand-mark">🔒</span>
      <span class="brand-name">CloudVault</span>
    </div>
    <p class="auth-tagline">Create a password you'll remember — it's also your encryption key.</p>

    {% if error %}
      <div class="banner banner-error">{{ error }}</div>
    {% endif %}

    <form method="POST" class="auth-form">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" minlength="3" required autofocus>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required>

      <label for="confirm">Confirm password</label>
      <input type="password" id="confirm" name="confirm" autocomplete="new-password" minlength="8" required>

      <p class="auth-note">⚠️ There is no password reset. Your password derives the key that
      decrypts your files — if you forget it, your files can't be recovered.</p>

      <button type="submit" class="btn btn-primary btn-block">Create account</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p>
  </div>
</body>
</html>
